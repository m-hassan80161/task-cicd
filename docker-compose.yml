services:

  postgres:
    image: postgres:16
    container_name: task_postgres

    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: taskdb

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: task_backend
    command: sh -c "npx prisma db push && npm start"

    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@postgres:5432/taskdb
      PORT: 3000

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3000"


  frontend:
    build:
      context: ./frontend

    container_name: task_frontend

    depends_on:
      - backend

    expose:
      - "5173"


  nginx:
    image: nginx:alpine

    container_name: task_nginx

    ports:
      - "8081:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend


volumes:
  postgres_data: